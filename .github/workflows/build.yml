name: Build Electron EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Update version
        if: github.event_name == 'workflow_dispatch'
        working-directory: frontend-vite
        run: |
          $version = "${{ github.event.inputs.version }}"
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json -Encoding UTF8

      - name: Install dependencies
        working-directory: frontend-vite
        run: npm ci

      - name: Build Electron app
        working-directory: frontend-vite
        run: npm run electron:build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaperLabeler-win
          path: |
            frontend-vite/release/*.exe
            frontend-vite/release/*.yml
          if-no-files-found: error

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upload update package to R2
        env:
          PYTHONIOENCODING: utf-8
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        shell: pwsh
        run: |
          # Windows runner 默认 cp1252，中文 print 会 UnicodeEncodeError
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $env:PYTHONIOENCODING = 'utf-8'
          $env:PYTHONUTF8 = '1'

          if ([string]::IsNullOrWhiteSpace($env:R2_ACCOUNT_ID) -or
              [string]::IsNullOrWhiteSpace($env:R2_ACCESS_KEY_ID) -or
              [string]::IsNullOrWhiteSpace($env:R2_SECRET_ACCESS_KEY)) {
            Write-Host "::error::Missing R2 secrets (R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY)"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:R2_BUCKET)) { $env:R2_BUCKET = 'paperlabeler' }
          if ([string]::IsNullOrWhiteSpace($env:R2_PUBLIC_BASE)) { $env:R2_PUBLIC_BASE = 'https://img.paperlabeler.de5.net' }

          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ github.event.inputs.version }}'
            $tag = "v$version"
          } else {
            $tag = '${{ github.ref_name }}'
            $version = $tag.TrimStart('v', 'V')
          }

          $exe = Get-ChildItem frontend-vite/release/*-portable.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Host '::error::portable exe not found'
            exit 1
          }

          python -X utf8 scripts/upload_release_r2.py "$($exe.FullName)" `
            --version $version `
            --level prompt `
            --notes "v$version" `
            --html-url "https://github.com/${{ github.repository }}/releases/tag/$tag"

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend-vite/release/*.exe
            frontend-vite/release/*.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (on manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          files: |
            frontend-vite/release/*.exe
            frontend-vite/release/*.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
